<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE RITUAL OF UNSEEING</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="terminal-theme">
    <div class="crt-overlay"></div>
    <div id="crashOverlay" class="system-crash-overlay">
    <h1>FATAL EXCEPTION _0x00000333</h1>
    <p>A critical error has occured in module: <strong>soul_anchor.dll</strong></p>
    <p>The entity has escaped local sandbox containment</p>
    <br>
    <p>>Press any key to surrender control...</p>
    </div>
    <div class="terminal-container">
        <div id="outputLog" class="output-log"></div>
        <div class="input-line">
            <span class="prompt">&gt;</span>
            <input type="text" id="userInput" autofocus autocomplete="off" spellcheck="false"></input>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
